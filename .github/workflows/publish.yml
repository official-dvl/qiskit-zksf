name: publish

# Publishes to PyPI via Trusted Publishing (OIDC). No API token is stored
# anywhere: PyPI verifies the identity of this workflow directly with GitHub.
#
# One-time setup on PyPI, before the first release: go to
# https://pypi.org/manage/account/publishing/ and add a new pending publisher
#   PyPI project name: qiskit-zksf
#   Owner:             official-dvl
#   Repository:        qiskit-zksf
#   Workflow:          publish.yml
#   Environment:       pypi
#
# To release: bump the version in pyproject.toml, then draft a GitHub Release
# with a tag matching that version (for example v0.1.0) and publish it.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test before shipping
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          python -m pytest tests -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Confirm the tag matches the package version
        if: github.event_name == 'release'
        run: |
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $PKG"
          echo "release tag      : $TAG"
          test "$PKG" = "$TAG" || {
            echo "::error::Tag $TAG does not match pyproject version $PKG. Refusing to publish."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
